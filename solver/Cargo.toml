[package]
name = "navier-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser build of Navier's dealiased Fourier spectral IFRK4 solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "=23.0.1", default-features = false, features = ["wgsl", "webgpu", "metal"] }

[dev-dependencies]
pollster = "0.4"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
