name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests git-cat-file pinned baseline/receipt commits;
          # the default shallow checkout (fetch-depth 1) lacks them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python checks
        run: python3 -m unittest discover -s tests -v

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
      - name: Emit public axiom audit
        run: lake env lean Navier/AxiomAudit.lean
