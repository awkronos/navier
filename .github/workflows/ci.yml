name: Verify

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The old topology was the defect, not the tree. Measured 2026-09-22: the
# last ~100 Verify runs on this repo recorded ZERO successes — every
# `push:` (any branch, unbounded) queued a fresh cold GitHub-hosted build of
# the full ~9750-target project graph, and the next fleet-lane push cancelled
# the one in flight at ~44 min (timed run 2026-09-22T01:38:59Z -> 02:22:51Z,
# conclusion=cancelled). A build that can only finish between two pushes
# never finishes. The same source compiles green on the warm Studio tree
# (lake build exit 0), so the math is fine; the runner choice and trigger
# scope are not.
#
# This is the pattern already proven green for awkronos/polya on the same
# org runners: trigger on main + PRs only, one run per ref with
# cancel-in-progress so a burst collapses to the newest, and run the Lean
# job on the self-hosted [self-hosted, lean] runner where the Mathlib shared
# cache and toolchain already resolve (lake exe cache get), with an explicit
# timeout instead of an open-ended queue.
concurrency:
  # CI-CANCEL-1120 -> CI-SHAKEY-1126: the ref key was the eviction.
  #
  # A concurrency group holds ONE in-flight run plus ONE queued run, and a third
  # arrival into a full group cancels the OLDEST queued run. That eviction is NOT
  # governed by cancel-in-progress — `cancel-in-progress: false` protects only the
  # run already executing. So `group: ...-${{ github.ref }}` put every main push in
  # one group, and a burst of fleet pushes to main buried a verdict whose build had
  # not started yet. Measured on this repo while main was at
  # 5c847fb035efb5f4504018ec32029e8bf155efef: the two preceding main Verify runs,
  # 22f9cfd3b20f (queued 15:40Z) and e226dca18a12 (queued 17:10Z), both ended
  # conclusion=cancelled with nothing wrong in either tree — each was the oldest
  # pending run when the next main push arrived. The loss is asymmetric — the commit
  # stays landed and the only surviving evidence for it is a cancellation, which
  # proves nothing about the tree it ran.
  #
  # The estate cure (pending-eviction-sha-group-cure-1123) keys push runs on the
  # commit, so each main push owns its group. It can still QUEUE behind a sibling —
  # waiting is honest, and timeout-minutes turns a stall into a failure receipt — but
  # it can no longer be cancelled to free a slot for a later commit, because no later
  # commit shares its key.
  #
  # Confirmed on the first push under this keying: d180a2ab75db queued at 21:18:54Z
  # while 5c847fb035ef's run — the OLDEST pending one, exactly the run the ref key
  # would have evicted — was still pending. Two main pushes, two groups, no
  # cancellation. Re-measure with
  # `gh run list --repo awkronos/navier --branch main --json headSha,status,conclusion`.
  #
  # Non-push events keep the ref key: PR updates still collapse to the newest run per
  # branch (the behaviour that made this topology survivable at all), and
  # workflow_dispatch keeps one group per ref rather than one per invocation.
  # cancel-in-progress stays PR-only — a main run finishes.
  group: verify-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # CI-CANCEL-1120: only a PR run is superseded by a newer push; a main run finishes
  # (a newer push now queues in its own sha-keyed group instead of evicting one).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    # Kept GitHub-hosted: measured green in the same cancelled run above
    # (python conclusion=success); it needs no Lean cache and no self-hosted
    # runner time.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests git-cat-file pinned baseline/receipt commits;
          # the default shallow checkout (fetch-depth 1) lacks them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scientific stack the solver tests need
        # Before this step the python job had no numpy/scipy at all, so
        # tests/test_navier_solver_equivalence.py's own `except ImportError:
        # raise unittest.SkipTest(...)` fired on every push and MetricContractTest
        # -- the numerical convergence / Richardson O(dt^4) contract this repo
        # exists to guard -- never ran on CI, while still printing "OK" as if it
        # had. Wheels only, no build isolation churn, and no pyfftw: the fast
        # path no longer requires it (navier_spectral_core._Plans bridges to
        # scipy.fft/numpy.fft when pyFFTW is absent), and a pyfftw wheel pulls
        # in an FFTW system library this runner does not need installed to
        # prove the bridge's bit-identity.
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run Python checks
        run: |
          set -eo pipefail
          # ONE battery definition: the repository's Makefile owns the list of
          # discovered roots (TEST_ROOTS), so CI cannot drift behind `make test`.
          # Before this, CI spelled `discover -s tests` and the 8
          # scripts/test_readme_scope_truth.py tests -- the gate README.md cites
          # for its own scope claims -- were collected by nothing scheduled.
          make test 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/or23-unittest.log"
          # OR23-Q8 EMPTYSELECT gate (Q1 shape): "Ran 0 tests" exits 0; bind
          # the step to a nonzero executed count. pipefail keeps tee honest.
          # Summed across roots now that the battery prints more than one
          # `Ran N tests` line; a last-match read would gate CI on one root
          # and let the others run unselected.
          n=$(grep -oE '^Ran [0-9]+ test' "${RUNNER_TEMP:-/tmp}/or23-unittest.log" | awk '{ total += $2 } END { print total + 0 }')
          echo "OR23-Q8 selected: ${n:-0} tests"
          test "${n:-0}" -ge 1
      - name: Assert MetricContractTest actually ran
        # numpy is installed now, so the module-level SkipTest above cannot
        # fire for that reason anymore -- the only remaining way it skips is
        # the unification shims' hard dependency on ~/reality/solvers/navier,
        # which is a separate private repository this job does not check out
        # (a cross-repo read would need its own credential, which is not this
        # lane's to mint). Same honesty rule the native-trust census below
        # already follows: an unmeasurable leg names its absence as a warning,
        # it never reports a pass on a count of zero.
        shell: bash
        run: |
          set -uo pipefail
          probe=$(python - <<'PY'
          import os
          path = os.path.expanduser("~/reality/solvers/navier/navier_spectral_core.py")
          print("present" if os.path.isfile(path) else "absent", path)
          PY
          )
          if [[ "$probe" == absent* ]]; then
            echo "::warning::MetricContractTest UNMEASURED on this runner: $probe is not checked out here, and awkronos/reality is a private repository this workflow has no cross-repo read credential for. This is not a pass -- the solver contract ran nowhere on this CI, only on hosts that carry both checkouts side by side (the dev host, and any future runner configured to fetch reality)."
            exit 0
          fi
          # "set -e" alone is not enough to catch a crash reliably here: a
          # module-level unittest.SkipTest raised outside of discovery (which
          # is exactly what a genuinely-broken import would do) exits the
          # interpreter with a traceback rather than a "skipped" line, and the
          # redirect below already swallows stdout+stderr into the log. Take
          # the exit code explicitly.
          python -m unittest -v tests.test_navier_solver_equivalence.MetricContractTest \
            > "${RUNNER_TEMP:-/tmp}/metric-contract.log" 2>&1
          rc=$?
          cat "${RUNNER_TEMP:-/tmp}/metric-contract.log"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::MetricContractTest crashed or failed (rc $rc) with numpy installed and reality reachable: $(tail -5 "${RUNNER_TEMP:-/tmp}/metric-contract.log")"
            exit 1
          fi
          if grep -qE '^test_.*skipped' "${RUNNER_TEMP:-/tmp}/metric-contract.log"; then
            echo "::error::MetricContractTest skipped despite numpy being installed and reality being reachable: $(grep -E 'skipped' "${RUNNER_TEMP:-/tmp}/metric-contract.log" | head -3)"
            exit 1
          fi
          if ! grep -qE '^OK$' "${RUNNER_TEMP:-/tmp}/metric-contract.log"; then
            echo "::error::MetricContractTest did not report OK"
            exit 1
          fi
          echo "MetricContractTest ran and passed on this runner"

      - name: Navier WorldSense receipt — CLI roundtrip and digest determinism
        # Lake-free, and until now the missing kind of leg here: the battery
        # (tests/test_navier_worldsense_receipt_1126.py) reaches this producer
        # by `import`, so every CI verdict on it came from the module's import
        # surface. Nothing scheduled ever ran the three paths a consumer
        # actually uses — `--self-test`, the `--out` -> `--check-file`
        # roundtrip, and two runs of `--json` agreeing on `receipt_sha256`.
        # A verification command no run executes verifies nothing; that is the
        # same law that put scripts/ into Makefile TEST_ROOTS and that wrote
        # tests/test_battery_schedule.py.
        #
        # The leg is re-executed VERBATIM from this file by
        # CiWorldSenseEnrollmentTest in that battery (same trick
        # test_battery_schedule.test_ci_selected_count_leg_sums_the_roots uses
        # for the OR23-Q8 count), on whatever host runs the tests, with
        # $PYTHON bound to that interpreter. So this step cannot rot into a
        # carrier that names a script, a flag or a digest field that no longer
        # exists: the day one of them goes, the battery goes red here instead
        # of quietly green in a workflow nobody reads.
        shell: bash
        run: |
          set -euo pipefail
          PY="${PYTHON:-python}"
          WS="${RUNNER_TEMP:-/tmp}/navier-worldsense"
          rm -rf "$WS"
          mkdir -p "$WS"
          $PY scripts/navier_worldsense_receipt.py --self-test
          $PY scripts/navier_worldsense_receipt.py --out "$WS/receipt.json"
          $PY scripts/navier_worldsense_receipt.py --check-file "$WS/receipt.json"
          measurement_digest() {
            $PY scripts/navier_worldsense_receipt.py --json \
              | $PY -c 'import json,sys; print(json.load(sys.stdin)["receipt_sha256"])'
          }
          first=$(measurement_digest)
          second=$(measurement_digest)
          if [[ -z "$first" || "$first" != "$second" ]]; then
            echo "::error::measurement digest is not reproducible across two runs: '${first}' vs '${second}'"
            exit 1
          fi
          echo "measurement digest stable across runs: $first"

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the browser target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test the locked native solver
        run: cargo test --locked --all-targets
      - name: Check the locked browser solver
        run: cargo check --locked --target wasm32-unknown-unknown --lib

  lean:
    runs-on: [self-hosted, lean]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4  # v7 injects credentials via includeIf.gitdir, which git matches against the REAL path; this runner checks out through a symlink onto the NAS (see kagami docs/ops/RUNNERS_ON_NAS.md), so v7 fetches with no credentials
      - name: Native-trust census ratchet (undisclosed native_decide sites may not rise)
        # Counts LIVE tactic sites of the tokens that mint a `_native.*` witness
        # axiom (native_decide, decide +native, bv_decide, Lean.ofReduceBool), with
        # comments and strings masked by Lean's grammar, and compares the number
        # that carry no disclosure against .github/native-decide-baseline.json. A native_decide result is
        # compiler-trusted, not kernel-checked; this leg keeps new ones from
        # arriving unlabelled. Text scan, no Lean, seconds.
        #
        # The estate keeps ONE census, in awkronos/reality
        # (scripts/native_decide_census.py); it is read from the runner's reality
        # object store, never copied into this repository. rc 1 = the count rose.
        # rc 2 = UNMEASURED (control did not fire, unreadable file or baseline) and
        # fails. A runner with no reality checkout cannot measure: that is reported
        # as a warning naming the absence, never as a pass on a count of zero.
        shell: bash
        run: |
          set -u
          R="${REALITY_CHECKOUT:-$HOME/reality}"
          CENSUS="${RUNNER_TEMP:-/tmp}/native_decide_census.py"
          git -C "$R" fetch -q origin main 2>/dev/null || true
          if git -C "$R" show origin/main:scripts/native_decide_census.py > "$CENSUS" 2>/dev/null \
              && grep -q -- '--ratchet' "$CENSUS"; then
            python3 "$CENSUS" --self-test
            python3 "$CENSUS" --root "$GITHUB_WORKSPACE" --ratchet "$GITHUB_WORKSPACE/.github/native-decide-baseline.json" --summary | tail -n 3
            exit "${PIPESTATUS[0]}"
          else
            echo "::warning::native-trust census UNMEASURED on this runner: no reality checkout at $R carrying scripts/native_decide_census.py with --ratchet; the ratchet did not run here"
          fi

      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          # Host user `runner` has no elan in a shared place and
          # actions/setup-python-style tool-cache writes fail on these hosts
          # ("mkdir: /Users/runner: Permission denied"); the per-run $HOME
          # install is the polya-proven route. --default-toolchain none lets
          # the repo's lean-toolchain file pick the version (era-independent:
          # this comment named a toolchain and went stale at the rc4 cutover).
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --output elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the shared Mathlib cache
        run: lake exe cache get
      # The full build IS the deliverable here (this is the project tree, not
      # a tool that imports a slice of it), and unlike the cancelled hosted
      # runs it lands on a warm-cache runner: lake build only elaborates
      # navier's own modules — Mathlib arrives from cache get. Budget 180 min
      # above polya's 90 because navier's own tree is the larger one; the
      # timeout exists to surface a stall as a FAILURE receipt, never as an
      # open-ended queue.
      - name: Build the project
        run: lake build
      # The API pin census diffs Navier/APIPin.lean's `#check` pins against the
      # compiler's own declaration environment (scripts/ApiEnvCensus.lean) and
      # the source-declared names, name by name. rc 1 on a missing or stale pin:
      # the exported surface of the two code-map T0 modules cannot drift away
      # from its test silently again.
      - name: API pins match the compiler declaration environment
        run: python3 scripts/api_pin_census.py
      - name: Emit public axiom audit
        run: lake env lean Navier/AxiomAudit.lean
      # Strict transitive census over every Navier declaration via
      # Lean.Util.CollectAxioms, rejecting anything outside
      # {propext, Classical.choice, Quot.sound}. sorryAx is not in the
      # allowed set, so this subsumes the lean-action `nanoda` sorry gate the
      # GitHub-hosted version used — one project-resident auditor instead of
      # an action input that silently disappears if the action stops running.
      - name: Reject disallowed transitive project axioms
        run: lake env lean scripts/AuditAllAxioms.lean
